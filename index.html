<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Aplikasi Saya</title>
</head>
<body>
    <h1>Aplikasi Terhubung ke Google Sheets</h1>
    <div id="hasil">Memuat data...</div>

    <script>
        // URL Google Apps Script Anda disimpan di dalam script web (disembunyikan dari teks biasa yang mudah dilihat jika di-minify, atau di-handle via proxy)
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbybVfhgIRX11fEDHNwjkNWi9hm6nqDP9E2HGMDOex1u/exec"; // *Catatan: Gunakan /exec untuk versi deployment, bukan /dev

        // Contoh mengambil data
        fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                document.getElementById('hasil').innerText = JSON.stringify(data);
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
